<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list items</title>
</head>
<body>
    <!---list--->

    <!--unordered list-->
    <ul >
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

    <!---different bullet styles--->
    <ul style="list-style-type:circle;">
        <li>Circle</li>
        <li>Circle</li>
        <li>Circle</li> 
    </ul>

    <ul type ="square">
        <li>Square</li>
        <li>Square</li>
        <li>Square</li>

    </ul>

    <!--ordered list-->
    <ol>
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>

    <!---different number styles--->
    <ol type ="A">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
    </ol>

    <ol type ="i">
        <li>One</li>
        <li>Two</li>
        <li>Three</li>

    </ol>

    <ol start="5">
        <li>Five</li>
        <li>Six</li>
        <li>Seven</li>
    </ol>

    <hr>

    <!--definition list-->
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>
        <dt>CSS
            <dd>Cascading style sheets</dd>
        </dt>
    </dl>
</body>
</html>
