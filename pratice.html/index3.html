<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <table  border="5" cellspacing="5" cellpadding="9">
        <thead>
            <tr>
                <th>Header 1</th>
                <th>Header 2</th>
                <th>Header 3</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Cell 1</td>
                <td>Cell 2</td>
                <td>Cell 3</td>
            </tr>
            <tr>
                <td>Cell 4</td>
                <td>Cell 5</td>
                <td>Cell 6</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>Footer 1</td>
                <td>Footer 2</td>
                <td>Footer 3</td>
            </tr>
        </tfoot>
    </table>
     <br>

    <!---table attributes-->
    <table border="2" cellspacing="10" cellpadding="5">
        <tr>
            <td colspan="2">Cell A</td>
            <td>Cell B</td>
            <td>Cell C</td>
        </tr>
        <tr>
            <td rowspan="2">Cell D</td>
            <td>Cell E</td>
            <td>Cell F</td>
        </tr>

    </table>

    <table>
        <caption>Table Caption</caption>
    </table>

</body>
</html>
